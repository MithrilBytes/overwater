name: overwater
description: >-
  Fail builds that introduce new LLM overwatering. Reads code, transmits
  nothing, needs no secrets.

inputs:
  path:
    description: Repository path to scan
    required: false
    default: "."
  baseline:
    description: Baseline file for the ratchet; empty scans without one
    required: false
    default: ""
  fail-on:
    description: "Failure policy: new, any, or none"
    required: false
    default: new
  incremental:
    description: Scan only files changed since the baseline's recorded commit
    required: false
    default: "false"
  pr-comment:
    description: >-
      Post the verdict as a sticky comment on pull requests. Needs the
      caller to grant pull-requests write permission.
    required: false
    default: "false"
  github-token:
    description: Token used only for the PR comment
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: fetch pinned overwater binary
      shell: bash
      # The version and checksums below pin one release. Bump them
      # together when cutting a new one; the sha values come from that
      # release's SHA256SUMS.
      run: |
        set -euo pipefail
        version="v2.0.0"
        case "${RUNNER_OS}_${RUNNER_ARCH}" in
          Linux_X64)     bin="overwater_linux_amd64"       sha="29c4c9c77650286f89d8b18593e127790710876f2404a35447a69306db80ff8d" ;;
          Linux_ARM64)   bin="overwater_linux_arm64"       sha="49f42a6702ca94f0cd480d4bd23f67d846f5e30204a73801821895ae298e4e69" ;;
          macOS_X64)     bin="overwater_darwin_amd64"      sha="ee492844cc8749be061ad05d5bbd7f61018f6c25621b4630e88f3899e156a93f" ;;
          macOS_ARM64)   bin="overwater_darwin_arm64"      sha="6c2a3faf4b8b14e0387b700ae85c2158d23020a33ef5daa6d73548fc4335afb6" ;;
          Windows_X64)   bin="overwater_windows_amd64.exe" sha="6b89962fdb7c1167215f67aff932daf412d0ba5343ea3a36c9ceb42a8df4516b" ;;
          *)
            echo "unsupported runner: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        dest="${RUNNER_TEMP}/overwater"
        if [ "$RUNNER_OS" = "Windows" ]; then dest="${dest}.exe"; fi
        curl -fsSL -o "$dest" "https://github.com/MithrilBytes/overwater/releases/download/${version}/${bin}"
        if command -v sha256sum > /dev/null; then
          echo "${sha}  ${dest}" | sha256sum -c -
        else
          echo "${sha}  ${dest}" | shasum -a 256 -c -
        fi
        chmod +x "$dest"
        echo "OVERWATER_BIN=$dest" >> "$GITHUB_ENV"

    - name: scan
      id: scan
      shell: bash
      # Inputs reach the script only through env: a value interpolated
      # into the script text would be re parsed as shell. The fences are
      # four backticks so a repo controlled path containing ``` cannot
      # break out of the report block.
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_INCREMENTAL: ${{ inputs.incremental }}
      run: |
        set -uo pipefail
        args=(scan --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_BASELINE" ]; then
          args+=(--baseline "$INPUT_BASELINE")
        fi
        if [ "$INPUT_INCREMENTAL" = "true" ]; then
          args+=(--incremental)
        fi
        args+=("$INPUT_PATH")
        out="${RUNNER_TEMP}/overwater-out.txt"
        errout="${RUNNER_TEMP}/overwater-err.txt"
        set +e
        "$OVERWATER_BIN" "${args[@]}" > "$out" 2> "$errout"
        code=$?
        set -e
        cat "$out"
        cat "$errout" >&2
        report="${RUNNER_TEMP}/overwater-report.md"
        {
          echo "## overwater"
          echo
          echo '````'
          cat "$out"
          echo '````'
          if [ -s "$errout" ]; then
            echo
            echo '````'
            cat "$errout"
            echo '````'
          fi
        } > "$report"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"

    - name: pr comment
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      # Sticky: one overwater comment per PR, updated in place. A
      # comment failure never changes the scan's exit code.
      run: |
        set -uo pipefail
        marker="<!-- overwater -->"
        body="${RUNNER_TEMP}/overwater-comment.md"
        { echo "$marker"; cat "${{ steps.scan.outputs.report }}"; } > "$body"
        repo="${{ github.repository }}"
        pr="${{ github.event.pull_request.number }}"
        existing=$(gh api "repos/$repo/issues/$pr/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1 || true)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$repo/issues/comments/$existing" -F body=@"$body" > /dev/null \
            || echo "could not update the PR comment" >&2
        else
          gh api "repos/$repo/issues/$pr/comments" -F body=@"$body" > /dev/null \
            || echo "could not create the PR comment; the workflow needs pull-requests: write" >&2
        fi

    - name: report exit code
      shell: bash
      run: exit "${{ steps.scan.outputs.code }}"
