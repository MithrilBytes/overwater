name: overwater
description: >-
  Fail builds that introduce new LLM overwatering. Reads code, transmits
  nothing, needs no secrets.

inputs:
  path:
    description: Repository path to scan
    required: false
    default: "."
  baseline:
    description: Baseline file for the ratchet; empty reports without failing
    required: false
    default: ""
  fail-on:
    description: "Failure policy: new, any, or none; new needs a baseline"
    required: false
    default: new
  incremental:
    description: Scan only files changed since the baseline's recorded commit
    required: false
    default: "false"
  pr-comment:
    description: >-
      Post the verdict as a sticky comment on pull requests. Needs the
      caller to grant pull-requests write permission.
    required: false
    default: "false"
  binary:
    description: >-
      Path to an already built overwater binary. Skips the download, so
      this Action can be run against the tree it lives in rather than
      against the last release. Used by this repository's own dogfood
      workflow; there is no reason to set it otherwise.
    required: false
    default: ""
  github-token:
    description: Token used only for the PR comment
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: fetch pinned overwater binary
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_BINARY: ${{ inputs.binary }}
      # Only the version pins a release here, and a version is known
      # before the tag exists. Checksums are not: they are computed from
      # the built artifacts, so committing them means committing after
      # the tag, which is how vX.Y.Z came to carry the previous
      # release's digests and why the floating tag was the only ref that
      # resolved. Provenance replaces them. It is signed on the release
      # path, it certifies the repository and workflow that produced the
      # bytes, and unlike a digest that travels with the artifact it
      # cannot be reissued by whoever replaced the artifact.
      run: |
        set -euo pipefail
        # A caller supplied binary is the tree's own build. The version
        # below names a release that does not exist yet between the bump
        # and the tag, which is the window this repository's own dogfood
        # job runs in.
        if [ -n "$INPUT_BINARY" ]; then
          chmod +x "$INPUT_BINARY"
          echo "OVERWATER_BIN=$INPUT_BINARY" >> "$GITHUB_ENV"
          exit 0
        fi
        version="v2.7.0"
        repo="MithrilBytes/overwater"
        case "${RUNNER_OS}_${RUNNER_ARCH}" in
          Linux_X64)     bin="overwater_linux_amd64"       ;;
          Linux_ARM64)   bin="overwater_linux_arm64"       ;;
          macOS_X64)     bin="overwater_darwin_amd64"      ;;
          macOS_ARM64)   bin="overwater_darwin_arm64"      ;;
          Windows_X64)   bin="overwater_windows_amd64.exe" ;;
          *)
            echo "unsupported runner: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        dest="${RUNNER_TEMP}/overwater"
        if [ "$RUNNER_OS" = "Windows" ]; then dest="${dest}.exe"; fi
        base="https://github.com/${repo}/releases/download/${version}"
        curl -fsSL -o "$dest" "${base}/${bin}"

        # The release's own digest catches a truncated download. It
        # proves nothing about origin, which is what the attestation is
        # for, so both run and both are fatal.
        curl -fsSL -o "${RUNNER_TEMP}/SHA256SUMS" "${base}/SHA256SUMS"
        line="$(grep -E "^[0-9a-fA-F]{64} [ *]${bin}\$" "${RUNNER_TEMP}/SHA256SUMS" || true)"
        if [ -z "$line" ]; then
          echo "the SHA256SUMS published with ${version} has no line for ${bin}" >&2
          exit 2
        fi
        if command -v sha256sum > /dev/null; then
          echo "${line%% *}  ${dest}" | sha256sum -c -
        else
          echo "${line%% *}  ${dest}" | shasum -a 256 -c -
        fi

        if command -v gh > /dev/null 2>&1; then
          if ! gh attestation verify "$dest" --repo "$repo"; then
            echo "build provenance for ${bin} did not verify; refusing to run it" >&2
            exit 2
          fi
        else
          echo "gh is not on this runner, so only the release's own SHA256SUMS was checked" >&2
        fi
        chmod +x "$dest"
        echo "OVERWATER_BIN=$dest" >> "$GITHUB_ENV"

    - name: scan
      id: scan
      shell: bash
      # Inputs reach the script only through env: a value interpolated
      # into the script text would be re parsed as shell. Tool output is
      # escaped into <pre> rather than fenced: a scanned path may hold a
      # newline followed by backticks, and no fence is long enough to
      # outrun a repository that picks the next length.
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_INCREMENTAL: ${{ inputs.incremental }}
      run: |
        set -uo pipefail
        # --fail-on new has nothing to be new against without a
        # baseline, and the baseline input defaults to empty, so naming
        # the policy anyway exits 2 on a correct scan of a clean repo.
        args=(scan)
        if [ -n "$INPUT_BASELINE" ]; then
          args+=(--baseline "$INPUT_BASELINE" --fail-on "$INPUT_FAIL_ON")
        elif [ "$INPUT_FAIL_ON" != "new" ]; then
          args+=(--fail-on "$INPUT_FAIL_ON")
        else
          echo "overwater: no baseline input, so this run only reports; set one to fail on new findings" >&2
        fi
        if [ "$INPUT_INCREMENTAL" = "true" ]; then
          args+=(--incremental)
        fi
        args+=("$INPUT_PATH")
        out="${RUNNER_TEMP}/overwater-out.txt"
        errout="${RUNNER_TEMP}/overwater-err.txt"
        set +e
        "$OVERWATER_BIN" "${args[@]}" > "$out" 2> "$errout"
        code=$?
        set -e
        cat "$out"
        cat "$errout" >&2
        report="${RUNNER_TEMP}/overwater-report.md"
        # Nothing inside a <pre> block is Markdown, so once & < > are
        # escaped a scanned path has no way to close the block or to
        # render anything of its own in the comment.
        escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' "$1"; }
        {
          echo "## overwater"
          echo
          echo '<pre>'
          escape "$out"
          echo '</pre>'
          if [ -s "$errout" ]; then
            echo
            echo '<pre>'
            escape "$errout"
            echo '</pre>'
          fi
        } > "$report"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"

    - name: pr comment
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      # Sticky: one overwater comment per PR, updated in place. A
      # comment failure never changes the scan's exit code.
      run: |
        set -uo pipefail
        marker="<!-- overwater -->"
        body="${RUNNER_TEMP}/overwater-comment.md"
        { echo "$marker"; cat "${{ steps.scan.outputs.report }}"; } > "$body"
        repo="${{ github.repository }}"
        pr="${{ github.event.pull_request.number }}"
        existing=$(gh api "repos/$repo/issues/$pr/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1 || true)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$repo/issues/comments/$existing" -F body=@"$body" > /dev/null \
            || echo "could not update the PR comment" >&2
        else
          gh api "repos/$repo/issues/$pr/comments" -F body=@"$body" > /dev/null \
            || echo "could not create the PR comment; the workflow needs pull-requests: write" >&2
        fi

    - name: report exit code
      shell: bash
      run: exit "${{ steps.scan.outputs.code }}"
