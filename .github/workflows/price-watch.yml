name: price-watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# The branch name carries the run id, so two runs cannot land on the
# same ref. This keeps them from racing to commit and open a PR for the
# same drift at all.
concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fetch litellm prices
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/litellm.json \
            https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
      - name: diff and apply
        # A run block is bash -e but not pipefail, so the step would take
        # tee's exit status and a catalog diff that exited 2 would commit
        # a half applied catalog behind a green run.
        run: |
          set -euo pipefail
          go run ./cmd/overwater catalog diff -write /tmp/litellm.json | tee /tmp/diff.txt
      - name: models upstream prices and we do not
        # The full list is over a thousand entries and says the same thing
        # every night. Only what appeared since the last run is news, so
        # the roster is committed and this reports the delta against it.
        run: |
          set -euo pipefail
          go run ./cmd/overwater catalog diff -reverse /tmp/litellm.json \
            2>> "$GITHUB_STEP_SUMMARY" | cut -f1 | sort > /tmp/unlisted.txt
          # pipefail catches a diff that failed. This catches one that
          # succeeded and printed nothing, which the comm below would read
          # as upstream dropping every model and commit as an empty roster.
          if [ ! -s /tmp/unlisted.txt ]; then
            echo "the reverse diff listed no models; leaving the roster alone" >&2
            exit 1
          fi
          comm -13 catalog/unlisted.txt /tmp/unlisted.txt > /tmp/new-models.txt || true
          comm -23 catalog/unlisted.txt /tmp/unlisted.txt > /tmp/gone-models.txt || true
          cp /tmp/unlisted.txt catalog/unlisted.txt
          if [ -s /tmp/new-models.txt ]; then
            {
              echo
              echo "### New upstream models, absent from this catalog"
              echo
              echo '```'
              go run ./cmd/overwater catalog diff -reverse \
                -only "$(paste -sd, /tmp/new-models.txt)" /tmp/litellm.json 2>/dev/null
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s /tmp/gone-models.txt ]; then
            echo "$(wc -l < /tmp/gone-models.txt) models upstream dropped or we adopted" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: open pr when prices moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "prices match litellm" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The roster alone is not worth a release, so a run that only
          # refreshed it uses a branch price-release does not act on. The
          # branch, the commit and the PR are one decision, made here.
          prefix="price-watch"
          title="chore: update catalog prices from litellm"
          if git diff --quiet -- catalog/models catalog/catalog.json catalog/VERSION; then
            prefix="catalog-roster"
            title="chore: refresh the upstream model roster"
          fi
          # The date alone repeats, and the push below is forced: a second
          # run in a day would rewrite the branch under an open PR and
          # discard whatever a reviewer had pushed onto it.
          branch="$prefix/$(date +%Y-%m-%d)-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add catalog/
          git commit -m "$title"
          git push -f origin "$branch"
          {
            echo "Detected by the nightly diff against LiteLLM's pricing file."
            echo "Verify each change against the provider source URL before merging."
            echo
            echo '```'
            cat /tmp/diff.txt
            echo '```'
            if [ -s /tmp/new-models.txt ]; then
              echo
              echo "New upstream models this catalog does not carry. Adding one"
              echo "decides a tier and a capability set, so none is applied here."
              echo
              echo '```'
              go run ./cmd/overwater catalog diff -reverse \
                -only "$(paste -sd, /tmp/new-models.txt)" /tmp/litellm.json 2>/dev/null
              echo '```'
            fi
          } > /tmp/body.md
          # A pushed branch with no PR notifies nobody, and the run that
          # left it there was the notification. Fail so the schedule does.
          if ! gh pr create --title "$title" \
            --body-file /tmp/body.md --head "$branch"; then
            echo "pushed $branch but could not open a PR; check that Actions may create pull requests" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
