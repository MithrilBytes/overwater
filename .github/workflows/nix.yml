name: nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: evaluate the flake
        run: nix flake check --no-build --all-systems
      - name: build and run
        # A go.mod change makes vendorHash stale and this step fails.
        # Nix names the hash it wanted in the error; paste that into
        # flake.nix.
        run: |
          nix build .#overwater
          ./result/bin/overwater version

  alert:
    needs: flake
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="nix build failed"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title" --json number --jq '.[0].number // empty')"
          body="The flake build failed on $(date -u +%Y-%m-%d): $RUN_URL."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body" > /dev/null
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" > /dev/null
          fi
