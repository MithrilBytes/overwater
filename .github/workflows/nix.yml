name: nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: evaluate the flake
        run: nix flake check --no-build --all-systems
      - name: build and run
        # A go.mod change makes vendorHash stale and this step fails.
        # Nix names the hash it wanted in the error; paste that into
        # flake.nix.
        run: |
          nix build .#overwater
          ./result/bin/overwater version
