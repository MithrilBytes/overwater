name: nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: evaluate the flake
        run: nix flake check --no-build --all-systems
      - name: fill in vendorHash
        # Only nix can compute this hash, and it reports the right one
        # when the wrong one fails the build. Nobody here runs nix, so
        # the runner that does writes it back. Fires only while the
        # placeholder is present, and only on main.
        if: github.ref == 'refs/heads/main'
        run: |
          set -uo pipefail
          grep -q 'vendorHash = "sha256-AAAA' flake.nix || exit 0
          got="$(nix build .#overwater 2>&1 | grep -oE 'got: *sha256-[A-Za-z0-9+/=]+' | head -1 | sed 's/got: *//')"
          if [ -z "$got" ]; then
            echo "nix did not report a vendor hash; leaving the placeholder" >&2
            exit 0
          fi
          sed -i "s|vendorHash = \"sha256-AAAA[A-Za-z0-9+/=]*\";|vendorHash = \"$got\";|" flake.nix
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(nix): pin the vendor hash nix computed" flake.nix
          git push origin HEAD:main

      - name: build and run
        run: |
          set -euo pipefail
          if grep -q 'vendorHash = "sha256-AAAA' flake.nix; then
            echo "vendorHash is still the placeholder; skipping the build." >&2
            exit 0
          fi
          nix build .#overwater
          ./result/bin/overwater version
