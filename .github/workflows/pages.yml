name: pages

# Publishes the project page and the catalog mirror together. The page
# reads catalog.json from its own origin, so the two have to deploy as
# one artifact or the site would show a version the mirror does not have.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog/catalog.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: is pages enabled
        id: pages
        # Pages is a repository setting a human turns on once. Until then
        # this deploys nothing rather than failing every push to main.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled; skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "Enable it under Settings, Pages, Source: GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        name: assemble
        run: |
          set -euo pipefail
          cp catalog/catalog.json site/
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
