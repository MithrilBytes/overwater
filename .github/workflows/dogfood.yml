name: dogfood

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Both jobs run the Action against a binary built from this tree, not
# the one the Action would download. That is what dogfooding should mean
# here: the download path fetches the last release, so a change in this
# commit would not be under test, and between an action.yml bump and its
# tag the named release does not exist at all.
jobs:
  firehose-must-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/overwater" ./cmd/overwater
      - id: scan
        continue-on-error: true
        uses: ./
        with:
          path: fixtures/ts-chat-firehose
          fail-on: any
          pr-comment: "true"
          binary: ${{ runner.temp }}/overwater
      - name: the firehose fixture must exit 1
        run: test "${{ steps.scan.outcome }}" = "failure"

  clean-app-must-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/overwater" ./cmd/overwater
      - uses: ./
        with:
          path: fixtures/clean-app
          fail-on: any
          binary: ${{ runner.temp }}/overwater
