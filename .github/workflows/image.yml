name: image

# Builds and smoke tests the container image on every push and pull
# request so the Dockerfile cannot rot between tags, and publishes it to
# GHCR on a v* tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish; the caller must have pushed it already
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mithrilbytes/overwater
      # Called by price-release after a merged price change, or entered
      # directly by a tag push. Empty on a branch or pull request build,
      # which builds a dev image and publishes nothing.
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: build image
        run: |
          set -euo pipefail
          version="${TAG:-dev}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker build --build-arg "VERSION=$version" -t "$IMAGE:ci" .
      - name: smoke image
        run: |
          set -euo pipefail
          got="$(docker run --rm "$IMAGE:ci" version)"
          if [ "$got" != "overwater $VERSION" ]; then
            echo "version says '$got', want 'overwater $VERSION'" >&2
            exit 1
          fi
          # The default command is the documented usage: scan the volume
          # mounted at /repo.
          docker run --rm -v "$PWD/fixtures/py-extraction:/repo:ro" "$IMAGE:ci" \
            | tee "$RUNNER_TEMP/scan.txt"
          grep -q "Call site: extract.py:24" "$RUNNER_TEMP/scan.txt"
          # And the gate still exits 1 through the entrypoint.
          if docker run --rm -v "$PWD/fixtures/py-extraction:/repo:ro" "$IMAGE:ci" \
               scan -fail-on any /repo > /dev/null; then
            echo "scan -fail-on any exited 0 on a repo with findings" >&2
            exit 1
          fi
      - name: publish to ghcr
        if: inputs.tag || startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker tag "$IMAGE:ci" "$IMAGE:$TAG"
          docker tag "$IMAGE:ci" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
