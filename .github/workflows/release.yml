name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release; the caller must have pushed it already
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Called by price-release after a merged price change, or entered
      # directly by a tag push.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build binaries
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="dist/overwater_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then out="$out.exe"; fi
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/MithrilBytes/overwater/internal/cli.buildVersion=$TAG" \
              -o "$out" ./cmd/overwater
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/overwater_*
      - name: release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2> /dev/null || true)"
          if [ -n "$prev" ]; then range="$prev..$TAG"; else range="$TAG"; fi
          git log --no-merges --format=%s "$range" \
            | go run ./internal/release/cmd -prev "$prev" -tag "$TAG" -repo "$REPO" \
            > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # The Action pins a release binary by checksum, and those checksums do
  # not exist until the release above has built. So no tag can ever
  # carry its own pin: whatever action.yml says at v2.4.0 was true of
  # v2.3.0. This closes that by pinning after the fact and moving the
  # floating major tag, which is what the README tells readers to use.
  pin:
    needs: release
    runs-on: ubuntu-latest
    # Two releases in flight would both commit the pin to main and the
    # second would be rejected as non fast forward.
    concurrency:
      group: pin-main
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pin the action and manifests to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern SHA256SUMS --output "$RUNNER_TEMP/SHA256SUMS"
          go run ./tools/sync-manifests -version "$TAG" -sums "$RUNNER_TEMP/SHA256SUMS"
          major="$(go run ./tools/major-tag "$TAG")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "already pinned to $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            git add action.yml Formula scoop winget flake.nix
            git commit -m "chore: pin the action and manifests to $TAG"
            # Someone may have pushed while the release built.
            git pull --rebase origin main
            git push origin main
          fi
          # The floating tag moves whether or not the pin changed, since
          # a rerun must still leave it on the current commit.
          git tag -f "$major"
          git push -f origin "$major"
          echo "$major now points at $(git rev-parse --short HEAD) pinned to $TAG" >> "$GITHUB_STEP_SUMMARY"
