name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release; the caller must have pushed it already
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Called by price-release after a merged price change, or entered
      # directly by a tag push.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build binaries
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="dist/overwater_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then out="$out.exe"; fi
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/MithrilBytes/overwater/internal/cli.buildVersion=$TAG" \
              -o "$out" ./cmd/overwater
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/overwater_*
      - name: release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2> /dev/null || true)"
          if [ -n "$prev" ]; then range="$prev..$TAG"; else range="$TAG"; fi
          git log --no-merges --format=%s "$range" \
            | go run ./internal/release/cmd -prev "$prev" -tag "$TAG" -repo "$REPO" \
            > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
