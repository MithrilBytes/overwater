name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build binaries
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="dist/overwater_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then out="$out.exe"; fi
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/MithrilBytes/overwater/internal/cli.buildVersion=$GITHUB_REF_NAME" \
              -o "$out" ./cmd/overwater
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2> /dev/null || true)"
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="$GITHUB_REF_NAME"; fi
          git log --no-merges --format=%s "$range" \
            | go run ./internal/release/cmd -prev "$prev" -tag "$GITHUB_REF_NAME" -repo "$REPO" \
            > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
