name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: forbid em and en dashes
        run: |
          if grep -rnIP '[\x{2013}\x{2014}]' --exclude-dir=.git .; then
            echo 'em dash (U+2014) or en dash (U+2013) found; use a comma, colon, period, or parentheses' >&2
            exit 1
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: analyze benchmark
        run: go test -run '^$' -bench BenchmarkAnalyze -benchtime 2x ./internal/scan/
      - name: perf gate
        run: bash scripts/perf-gate.sh
      - name: smoke suite
        run: bash scripts/smoke.sh
      - name: cross compile
        # CGO_ENABLED=0 as the release builds: the binaries are static
        # and the action pins them by checksum.
        run: |
          for target in linux/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/overwater
          done
      - name: catalog.json is current
        run: |
          go run ./cmd/overwater catalog build
          git diff --exit-code -- catalog/catalog.json
