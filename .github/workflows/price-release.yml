name: price-release

# A merged price change is only in the catalog; the released binaries
# still embed the old snapshot. This tags the next patch so they ship.
on:
  pull_request:
    types: [closed]

jobs:
  tag:
    # A head branch name is a label anyone opening a PR can choose, and
    # this job releases main whatever the PR touched. The conditions it
    # actually relies on are that price-watch opened it, from a branch in
    # this repository, and that it merged into main.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'price-watch/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: next
        # A tag pushed with GITHUB_TOKEN does not start another workflow
        # run, so release and image run as called workflows below rather
        # than on the push.
        run: |
          set -euo pipefail
          # Assigned first: a failure inside process substitution would
          # not reach set -e, and an empty tag would push nothing quietly.
          next="$(git tag | go run ./internal/release/cmd -next-tag)"
          if [ -z "$next" ]; then
            echo "could not compute the next tag" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The Action names the release it fetches, and release.yml
          # refuses to build a tag whose tree names a different one. That
          # check is what makes an exact version pinnable, and it means
          # the bump has to land before the tag rather than after it, the
          # way the digests still do. Without this the tag would push and
          # the release would then fail, leaving a tag with no release.
          sed -i "s/^\( *version=\)\"v[0-9][^\"]*\"/\1\"$next\"/" action.yml
          # The install examples name the release too, and a test holds
          # them to whatever action.yml says.
          go run ./tools/sync-docs
          if ! git diff --quiet; then
            git add action.yml README.md site/index.html
            git commit -m "chore: name $next in the action before the tag lands"
            git pull --rebase origin main
            git push origin main
          fi
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "tagged $next" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: tag
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  # Binaries and image ship the same tag, so neither waits on the other.
  image:
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
