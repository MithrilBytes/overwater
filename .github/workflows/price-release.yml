name: price-release

# A merged price change is only in the catalog; the released binaries
# still embed the old snapshot. This tags the next patch so they ship.
on:
  pull_request:
    types: [closed]

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'price-watch/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: next
        # A tag pushed with GITHUB_TOKEN does not start another workflow
        # run, so release and image run as called workflows below rather
        # than on the push.
        run: |
          set -euo pipefail
          # Assigned first: a failure inside process substitution would
          # not reach set -e, and empty tags would push nothing quietly.
          next="$(git tag | go run ./internal/release/cmd -next-tags)"
          read -r update twin <<< "$next"
          if [ -z "$update" ] || [ -z "$twin" ]; then
            echo "could not compute the next tags from: $next" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The update tag carries the release; the twin exists so
          # go install can resolve a three component version.
          git tag "$update"
          git tag "$twin"
          git push origin "$update" "$twin"
          echo "tag=$update" >> "$GITHUB_OUTPUT"
          echo "tagged $update with semver twin $twin" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: tag
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  # Binaries and image ship the same tag, so neither waits on the other.
  image:
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
