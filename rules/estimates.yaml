# Cost model assumptions. Every number the engine uses lives in these
# YAML files, not in code. Findings label results as estimates, and
# calls_per_month is the default behind the --volume flag.
volume:
  calls_per_month: 10000
tokens:
  chars_per_token: 4
  default_input: 500
  default_output: 400
  embedding_input: 10000
  # A reasoning model bills its thinking at the output rate, and neither
  # a response schema nor max_tokens bounds it: both cap the answer, not
  # the reasoning that precedes it. So this is added to the output
  # estimate rather than being capped by it, and pricing a reasoning
  # model without it reads as though the thinking were free.
  reasoning_output: 1500
  # A response schema caps what the call can emit: the JSON envelope
  # plus a field's worth per field, and an enum field is one label off
  # a fixed list rather than free text. Deliberately generous per
  # field; the point is that a five field extraction is not an essay,
  # not that we can predict its length. Only ever lowers the estimate.
  schema_output:
    envelope: 10
    per_field: 40
    per_enum_field: 8
# Steady state prompt caching: the fraction of calls that read the
# cached system prompt rather than write it. 1.0 means the write cost
# amortizes to nothing at estimate volumes.
cache:
  steady_state_read_fraction: 1.0
# Fan in: a call site inside a helper runs once per caller of that
# helper, so calls_per_month multiplies by the caller count. Only the
# resolutions named here multiply; for the rest the scanner reports a
# floor of 1, not a count.
fan_in:
  multiply_when:
    - exact
