# Embeddings priced at the top of the tier when the same provider sells
# a standard tier. The engine drops the finding when the provider has
# no cheaper embedding to nominate.
id: pricey-embeddings
kind: finding
confidence: high
when:
  archetype: [embedding]
  # Inclusive: a model at exactly 0.10 per Mtok trips the rule.
  min_input_per_mtok: 0.10
candidate:
  strategy: cheapest_embedding
  note: same provider at the standard embedding tier
tripwire: If nearest neighbor agreement drops below 90%, stay put
# Two embedding models live in different vector spaces, so their
# vectors never match and the eval compares neighborhoods instead.
# Neighborhoods shift where chat answers would not, so the bar sits
# below the 97% the chat rules ask for.
tripwire_check:
  metric: nearest_neighbor_agreement
  compare: below
  threshold: 90
