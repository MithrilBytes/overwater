# A large system prompt resent on every call with no cache_control.
# Attaches as a flag to the finding at the same call site. Scoped to
# providers where caching is explicit; providers that cache
# automatically are excluded.
id: uncached-system-prompt
kind: flag
confidence: high
when:
  provider: [anthropic]
  min_system_tokens: 1024
  cache_control: false
flag: No prompt caching on a {system_tokens}-token repeated system prompt
candidate:
  strategy: cached_system_prompt
  note: same model with cache_control on the system prompt
tripwire: None; caching changes cost, not output
