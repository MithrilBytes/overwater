# Two or more call sites with identical parameters and the same model.
# The scanner cannot see runtime inputs, so this is a nomination, not
# proof of waste. Every site after the first in scan order gets it.
id: duplicate-call-sites
kind: finding
confidence: low
when:
  min_duplicate_sites: 2
candidate:
  strategy: none
  note: consolidate with the first identical call and share one cached result
tripwire: If the sites feed different runtime inputs, stay put
